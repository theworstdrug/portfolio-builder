# One container; HTTPS (Let's Encrypt) is handled by the app itself.
#   1. cp .env.example .env  and fill it in
#   2. point your domain's DNS at this server, open ports 80 + 443
#   3. docker compose up -d --build      then watch: docker compose logs -f
# Prefer Caddy in front instead? Use deploy/docker-compose.caddy.yml.
services:
  portfolio:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "80"          # used when TLS_MODE=off
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/data      # content, uploads, password and certificates
